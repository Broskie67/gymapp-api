services:
  backend:
    build: .
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      URL: http://localhost
      # "postgres" = nom du service ci-dessous, pas localhost
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/gymdb
    depends_on:
      postgres:
        condition: service_healthy
 
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: gymdb
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Exécuté automatiquement au premier démarrage (volume vide)
      - ./db/schema-postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gymdb"]
      interval: 2s
      timeout: 5s
      retries: 15
 
volumes:
  postgres-data:
 
      